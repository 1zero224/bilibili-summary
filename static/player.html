<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站播放器</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b10;
            color: #e8e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .wrap { width: min(1280px, 100vw); padding: 16px; }
        .bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .title { flex: 1; font-size: 15px; font-weight: 600; }
        select, .link {
            min-height: 34px;
            padding: 4px 12px;
            border: 1px solid #2b2b3a;
            border-radius: 8px;
            background: #171722;
            color: #e8e8f0;
            font: inherit;
            font-size: 13px;
        }
        .link { display: inline-flex; align-items: center; text-decoration: none; }
        video {
            display: block;
            width: 100%;
            max-height: 78vh;
            background: #000;
            border-radius: 10px;
        }
        .status { min-height: 20px; margin-top: 8px; color: #9a9aae; font-size: 13px; }
        .status.error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="bar">
            <div class="title" id="title">B站视频</div>
            <select id="quality"><option value="-1">自动清晰度</option></select>
            <a class="link" id="source" href="#" target="_blank" rel="noopener">在 B 站打开</a>
        </div>
        <video id="player" controls playsinline preload="metadata"></video>
        <div class="status" id="status">正在加载…</div>
    </div>
    <script src="/static/vendor/dash.all.min.js"></script>
    <script src="/static/player.js"></script>
</body>
</html>
